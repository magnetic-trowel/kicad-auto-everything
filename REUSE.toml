version = 1
SPDX-PackageName = "kicad-auto-everything"
SPDX-PackageDownloadLocation = "https://github.com/magnetic-trowel/kicad-auto-everything"

# Default: code and anything else not matched below is GPL-3.0-or-later.
# Files with their own SPDX header keep it ("closest").
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 kicad-auto-everything contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Benchmark results and board manifests we generate are CDLA-Permissive-2.0.
[[annotations]]
path = ["tools/research/**/results/*.jsonl", "bench/manifests/*.jsonl"]
precedence = "override"
SPDX-FileCopyrightText = "2026 kicad-auto-everything contributors"
SPDX-License-Identifier = "CDLA-Permissive-2.0"

# Documentation, research notes, and reports are CC-BY-4.0.
[[annotations]]
path = ["**/*.md", "research_notes/**", "reports/**", "docs/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 kicad-auto-everything contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# A footprint copied from the official KiCad library (kicad-footprint-generator output).
[[annotations]]
path = "tools/research/llm-design/designs/liion-balancer/footprints/custom.pretty/PhoenixContact_*.kicad_mod"
precedence = "override"
SPDX-FileCopyrightText = "KiCad Library Team and contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0 WITH KiCad-libraries-exception"

# Schematics and project symbol libraries generated by kaesynth embed KiCad library symbols
# (lib_symbols); the generated files are not committed but are covered if they are.
[[annotations]]
path = ["tools/research/llm-design/designs/**/out/**/*.kicad_sch", "tools/research/llm-design/designs/**/out/**/*.kicad_sym"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 kicad-auto-everything contributors", "KiCad Library Team and contributors"]
SPDX-License-Identifier = "GPL-3.0-or-later AND CC-BY-SA-4.0 WITH KiCad-libraries-exception"
