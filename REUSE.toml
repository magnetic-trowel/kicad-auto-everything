version = 1
SPDX-PackageName = "kicad-auto-everything"
SPDX-PackageDownloadLocation = "https://github.com/magnetic-trowel/kicad-auto-everything"

# Default: code and anything else not matched below is GPL-3.0-or-later.
# Files with their own SPDX header keep it ("closest").
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 kicad-auto-everything contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Documentation, research notes, and reports are CC-BY-4.0.
[[annotations]]
path = ["**/*.md", "research_notes/**", "reports/**", "docs/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 kicad-auto-everything contributors"
SPDX-License-Identifier = "CC-BY-4.0"
