<title>__TITLE__ Routings</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: a fab-drawing sheet. Tabs pick a board; three synced panels (human, plain, physics) share one view. */
:root {
  --bg: #f4f5f2;
  --surface: #fcfcfb;
  --ink: #1d211f;
  --ink-2: #545b57;
  --ink-3: #868d89;
  --rule: #d9dcd7;
  --accent: #2a6f5b;
  --board: #e6eae3;
  --board-edge: #2f3532;
  --pad: #b49a5a;
  --fab: #8c938e;
  --warn: #b4441c;
  --L0: #eb6834; --L1: #6250d6; --L2: #1baf7a; --L3: #eda100; --L4: #e87ba4; --L5: #2a78d6;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141716; --surface: #1b1f1d; --ink: #eceeea; --ink-2: #b8beb9; --ink-3: #858c87; --rule: #2f3532;
    --accent: #6cc3a6; --board: #222825; --board-edge: #a9b0ab; --pad: #c9ae6a; --fab: #6f7672; --warn: #ec8a5f;
    --L0: #d95926; --L1: #9085e9; --L2: #199e70; --L3: #c98500; --L4: #d55181; --L5: #3987e5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141716; --surface: #1b1f1d; --ink: #eceeea; --ink-2: #b8beb9; --ink-3: #858c87; --rule: #2f3532;
  --accent: #6cc3a6; --board: #222825; --board-edge: #a9b0ab; --pad: #c9ae6a; --fab: #6f7672; --warn: #ec8a5f;
  --L0: #d95926; --L1: #9085e9; --L2: #199e70; --L3: #c98500; --L4: #d55181; --L5: #3987e5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--display); font-size: 15px; line-height: 1.45; }
.wrap { padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1680px; margin: 0 auto; display: grid; gap: 18px; }
header { display: grid; gap: 6px; }
h1 { font-size: 1.7rem; font-weight: 600; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
.lede { margin: 0; color: var(--ink-2); max-width: 78ch; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { font: 500 0.95rem var(--display); padding: 6px 12px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: 4px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.tab:focus-visible, .chip:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { margin: 0; color: var(--ink-2); max-width: 90ch; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; font-size: 0.92rem; min-width: 560px; }
th, td { text-align: left; padding: 5px 14px 5px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 500; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.74rem; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.86rem; }
td.lab { color: var(--ink-2); padding-right: 22px; }
.best { color: var(--accent); font-weight: 500; }
.miss { color: var(--warn); }
.controls { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.glabel { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin-right: 2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 0.85rem var(--display); padding: 3px 9px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="false"] { color: var(--ink-3); background: transparent; }
.chip[aria-pressed="false"] .sw { opacity: 0.25; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
figure { margin: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; display: grid; grid-template-rows: auto 1fr; min-width: 0; }
figcaption { display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--rule); font-weight: 600; }
figcaption span { font-weight: 400; color: var(--ink-3); font-family: var(--mono); font-size: 0.78rem; }
.stage { position: relative; aspect-ratio: var(--ar, 4 / 3); max-width: 100%; touch-action: none; cursor: grab; }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.empty { display: grid; place-items: center; color: var(--ink-3); padding: 24px; text-align: center; }
.status { font-family: var(--mono); font-size: 0.84rem; color: var(--ink-2); min-height: 1.4em; }
.status b { color: var(--ink); font-weight: 500; }
.hint { color: var(--ink-3); font-size: 0.85rem; }
button.reset { font: 500 0.85rem var(--display); padding: 3px 10px; border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); color: var(--ink); cursor: pointer; }
/* drawing */
svg .outline { fill: var(--board); stroke: var(--board-edge); stroke-width: 0.25; }
svg .pour path { stroke-width: 0.15; stroke-dasharray: 0.8 0.6; fill-opacity: 0.07; stroke-opacity: 0.55; }
svg .trk path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
svg .via circle { fill: var(--surface); stroke: var(--ink-2); stroke-width: 0.08; }
svg .pads > * { fill: var(--pad); fill-opacity: 0.75; }
svg .fps path { fill: none; stroke: var(--fab); stroke-width: 0.08; }
svg .fps text { fill: var(--ink-3); font: 500 1px var(--display); text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
svg.dimkept [data-n]:not(.rr) { opacity: 0.12; }
svg.hl [data-n] { opacity: 0.12; }
svg.hl [data-n].on { opacity: 1; }
svg.hl .trk path.on { stroke-width: var(--hw); }
@media (prefers-reduced-motion: no-preference) { .tab, .chip { transition: background-color .12s, color .12s; } }
</style>

<div class="wrap">
  <header>
    <h1>__TITLE__</h1>
    <p class="lede">The same placement, routed several ways. Pours are drawn as outlines only (their fill is not shown); tracks are coloured by copper layer.</p>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <p class="note" id="note"></p>
  <div class="tablewrap"><table id="nums"></table></div>
  <div class="controls">
    <div class="group" id="layers"><span class="glabel">Layers</span></div>
    <div class="group"><span class="glabel">Show</span>
      <button class="chip" id="t-pours" aria-pressed="true">Pour outlines</button>
      <button class="chip" id="t-parts" aria-pressed="true">Part outlines</button>
      <button class="chip" id="t-kept" aria-pressed="false">Show only the highlighted nets</button>
    </div>
    <button class="reset" id="reset">Reset view</button>
  </div>
  <div class="status" id="status"><span class="hint">Scroll to zoom and drag to pan (all three move together). Hover a trace to light up its net on every version; click to keep it lit.</span></div>
  <div class="panels" id="panels"></div>
</div>

<script type="application/json" id="data">__DATA__</script>
<script type="application/json" id="meta">__META__</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const META = JSON.parse(document.getElementById('meta').textContent);
  const NAMES = {};
  const ROWS = (META.board && META.board.row_labels) || [...Object.keys((META.board || {}).rows || {}).map((k) => [k, k, 0]), ['length', 'Trace length', 0], ['vias', 'Vias', 0]];
  let cur = null, view = null, home = null, pinned = null;
  const hidden = new Set();
  const opts = { pours: true, parts: true, kept: false };
  const $ = (id) => document.getElementById(id);

  function layerColor(L, layers) {
    // copper colors in stack order: top first, bottom last (bottom always blue)
    if (L === 'B.Cu') return 'var(--L5)';
    const i = layers.indexOf(L);
    return `var(--L${Math.min(i, 4)})`;
  }

  function svgFor(b, v, rr) {
    const [x0, y0, x1, y1] = v.box;
    const order = [...b.layers].reverse();     // bottom first, top drawn last
    let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x0} ${y0} ${x1 - x0} ${y1 - y0}" preserveAspectRatio="xMidYMid meet">`;
    s += `<path class="outline" fill-rule="evenodd" d="${v.outline}"/>`;
    s += `<g class="pours">` + order.map((L) => v.pours[L] ? `<g class="pour" data-l="${L}" style="color:${layerColor(L, b.layers)}"><path fill="currentColor" stroke="currentColor" d="${v.pours[L]}"/></g>` : '').join('') + `</g>`;
    s += `<g class="pads b">${v.pads_b}</g>`;
    s += order.map((L) => `<g class="trk" data-l="${L}" style="stroke:${layerColor(L, b.layers)}">${v.tracks[L] || ''}</g>`).join('');
    s += `<g class="pads">${v.pads_f}</g><g class="via">${v.vias}</g><g class="fps">${v.fps}</g></svg>`;
    return s;
  }

  function show(key) {
    const b = DATA.find((d) => d.key === key), m = META[key];
    cur = { b, m };
    pinned = null;
    document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.k === key)));
    $('note').textContent = `${m.note}`;
    // numbers
    const vs = b.variants;
    const stats = vs.map((v) => v.stats || null);
    vs.forEach((v) => { NAMES[v.name] = v.label; });
    let t = '<thead><tr><th></th>' + vs.map((v) => `<th>${NAMES[v.name]}</th>`).join('') + '</tr></thead><tbody>';
    for (const [k, lab, rank] of ROWS) {
      const vals = vs.map((v, i) => k === 'length' ? (stats[i] ? `${stats[i].length_mm.toLocaleString()} mm` : '')
        : k === 'vias' ? (stats[i] ? String(stats[i].vias) : '') : (m.rows[k][i] || ''));
      const nums = vals.map((x) => { const q = parseFloat(x); return Number.isFinite(q) ? q : null; });
      const minV = Math.min(...nums.filter((x) => x !== null));
      t += `<tr><td class="lab">${lab}</td>`;
      vals.forEach((val, i) => {
        const best = rank && nums[i] !== null && nums[i] === minV;
        const miss = /✗/.test(val);
        t += `<td class="num${best ? ' best' : ''}${miss ? ' miss' : ''}">${val || '–'}</td>`;
      });
      t += '</tr>';
    }
    $('nums').innerHTML = t + '</tbody>';
    // layer chips
    const lg = $('layers');
    lg.querySelectorAll('.chip').forEach((c) => c.remove());
    hidden.clear();
    b.layers.forEach((L) => {
      const c = document.createElement('button');
      c.className = 'chip'; c.setAttribute('aria-pressed', 'true'); c.dataset.l = L;
      c.innerHTML = `<span class="sw" style="background:${layerColor(L, b.layers)}"></span>${L}`;
      c.onclick = () => { const on = c.getAttribute('aria-pressed') === 'true'; c.setAttribute('aria-pressed', String(!on)); on ? hidden.add(L) : hidden.delete(L); apply(); };
      lg.appendChild(c);
    });
    // panels
    const rr = new Set(m.rerouted.map((n) => b.nets.indexOf(n)).filter((i) => i >= 0));
    const P = $('panels');
    P.innerHTML = '';
    const ref = vs.find((v) => !v.missing);
    const [x0, y0, x1, y1] = ref.box;
    home = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
    view = { ...home };
    vs.forEach((v) => {
      const f = document.createElement('figure');
      const cap = `<figcaption>${NAMES[v.name]}<span>${v.stats ? v.stats.segments.toLocaleString() + ' segments' : ''}</span></figcaption>`;
      if (v.missing) { f.innerHTML = cap + `<div class="empty">The physics route of this board is still running.</div>`; P.appendChild(f); return; }
      f.innerHTML = cap + `<div class="stage" style="--ar:${home.w} / ${home.h}">${svgFor(b, v, rr)}</div>`;
      P.appendChild(f);
      const svg = f.querySelector('svg');
      svg.querySelectorAll('[data-n]').forEach((e) => { if (rr.has(+e.dataset.n)) e.classList.add('rr'); });
      wire(f.querySelector('.stage'), svg);
    });
    const w = home.w;
    document.querySelectorAll('#panels svg').forEach((s) => s.style.setProperty('--hw', ''));
    apply();
    $('status').innerHTML = '<span class="hint">Scroll to zoom and drag to pan (all three move together). Hover a trace to light up its net on every version; click to keep it lit.</span>';
    try { localStorage.setItem('board-tab', key); } catch (e) {}
  }

  function apply() {
    document.querySelectorAll('#panels svg').forEach((s) => {
      s.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
      s.querySelectorAll('[data-l]').forEach((g) => { g.style.display = hidden.has(g.dataset.l) ? 'none' : ''; });
      s.querySelector('.pours').style.display = opts.pours ? '' : 'none';
      s.querySelector('.fps').style.display = opts.parts ? '' : 'none';
      s.classList.toggle('dimkept', opts.kept);
    });
  }

  function light(n) {
    const name = n === null ? null : cur.b.nets[n];
    document.querySelectorAll('#panels svg').forEach((s) => {
      s.querySelectorAll('.on').forEach((e) => e.classList.remove('on'));
      s.classList.toggle('hl', n !== null && name !== '');
      if (n !== null && name !== '') s.querySelectorAll(`[data-n="${n}"]`).forEach((e) => e.classList.add('on'));
    });
    if (n === null || name === '') {
      $('status').innerHTML = '<span class="hint">Hover a trace to light up its net on every version; click to keep it lit.</span>';
      return;
    }
    const lens = [...document.querySelectorAll('#panels figure')].map((f) => {
      const s = f.querySelector('svg');
      if (!s) return null;
      let L = 0;
      s.querySelectorAll(`.trk path[data-n="${n}"]`).forEach((p) => { try { L += p.getTotalLength(); } catch (e) {} });
      return L;
    });
    const rr = cur.m.rerouted.includes(name);
    $('status').innerHTML = `<b>${name.replace(/[<>&]/g, '')}</b> · ${rr ? 'in the highlighted set' : 'not in the highlighted set'} · trace length ` +
      cur.b.variants.map((v, i) => `${NAMES[v.name]} ${lens[i] === null ? '–' : Math.round(lens[i]) + ' mm'}`).join(', ') + (pinned !== null ? ' · click empty board to release' : '');
  }

  function wire(stage, svg) {
    let drag = null;
    const pt = (e) => { const r = stage.getBoundingClientRect(); const k = Math.max(view.w / r.width, view.h / r.height); const ox = (r.width * k - view.w) / 2, oy = (r.height * k - view.h) / 2; return { x: view.x - ox + (e.clientX - r.left) * k, y: view.y - oy + (e.clientY - r.top) * k, k }; };
    stage.addEventListener('wheel', (e) => {
      e.preventDefault();
      const p = pt(e), z = Math.exp(e.deltaY * 0.0015);
      const w = Math.min(home.w * 1.5, Math.max(home.w / 60, view.w * z)), s = w / view.w;
      view = { x: p.x - (p.x - view.x) * s, y: p.y - (p.y - view.y) * s, w, h: view.h * s };
      apply();
    }, { passive: false });
    stage.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, v: { ...view }, moved: false }; stage.setPointerCapture(e.pointerId); });
    stage.addEventListener('pointermove', (e) => {
      if (drag) {
        const r = stage.getBoundingClientRect(), k = Math.max(view.w / r.width, view.h / r.height);
        const dx = (e.clientX - drag.x) * k, dy = (e.clientY - drag.y) * k;
        if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 3) drag.moved = true;
        view = { ...view, x: drag.v.x - dx, y: drag.v.y - dy };
        apply();
        return;
      }
      if (pinned !== null) return;
      const t = e.target.closest && e.target.closest('[data-n]');
      light(t ? +t.dataset.n : null);
    });
    stage.addEventListener('pointerup', (e) => {
      const moved = drag && drag.moved;
      drag = null;
      if (moved) return;
      const t = document.elementFromPoint(e.clientX, e.clientY);
      const n = t && t.closest && t.closest('[data-n]');
      pinned = n ? +n.dataset.n : null;
      light(pinned);
    });
    stage.addEventListener('pointerleave', () => { if (!drag && pinned === null) light(null); });
    stage.addEventListener('dblclick', () => { view = { ...home }; apply(); });
  }

  $('reset').onclick = () => { view = { ...home }; apply(); };
  for (const [id, k] of [['t-pours', 'pours'], ['t-parts', 'parts'], ['t-kept', 'kept']]) {
    $(id).onclick = (e) => { opts[k] = !opts[k]; e.currentTarget.setAttribute('aria-pressed', String(opts[k])); apply(); };
  }
  const tabs = $('tabs');
  DATA.forEach((d) => {
    const t = document.createElement('button');
    t.className = 'tab'; t.setAttribute('role', 'tab'); t.dataset.k = d.key;
    t.textContent = d.title + ` · ${d.layers.length} layers`; t.hidden = DATA.length < 2;
    t.onclick = () => { show(d.key); try { history.replaceState(null, '', '#' + d.key); } catch (e) {} };
    tabs.appendChild(t);
  });
  let start = location.hash.slice(1);
  if (!DATA.some((d) => d.key === start)) { try { start = localStorage.getItem('board-tab') || ''; } catch (e) { start = ''; } }
  show(DATA.some((d) => d.key === start) ? start : DATA[0].key);
})();
</script>
