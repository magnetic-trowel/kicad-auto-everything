  - kind: x-barrier_part
    part: MP1
    line: "south faces of J1-J4 (y ~ 122 mm), full enclosure width"
    height_mm: "PCB to lid (~130)"
    fixing: "flat sheet under the wall, die-cut around J1-J4 bodies, held down by them; nylon screws to the back panel beyond both board ends (no board holes)"
    covers: "wall: field-wiring compartment north of it; PCB, relays, PS1 and the Pi south of it. Sheet: all PCB copper north of the wall that is not under a terminal body"
    note: "supplementary insulation between field conductors (basic) and SELV/Pi, and between field conductors or bare EGCs and mask-only mains copper (review M3, REQ-31)"
    source: design
  - kind: x-volume_keepout
    region: "north of MP1, above J1-J4 up to the lid"
    what: "no parts; only terminal bodies, field conductors, EGC splice"
    note: "wire-bending space for 14-12 AWG solid conductors entering the terminals from above"
    source: design
  - kind: x-current_path
    net: net:L_IN
    amps: 15
    layers: "F.Cu,B.Cu"
    copper_oz: 2
    stitching: "4 x 0.6 mm vias every 10 mm"
    note: "width from Net(width_mm=7.5). L runs from J1.1 south, then west under the relay bodies into pads 13; L_SWk leaves pads 14 north and enters its terminal pole from the side away from the N pole (pole 1 from the west, pole 3 from the east) so it stays >= 6.4 mm from N; N runs on B.Cu along the south faces of J1-J4 through every pole 2 and PS1 AC/N; where N crosses an L or L_SW path each is single-layer for that crossing (7.5 mm, 2 oz carries 15 A at 10 K on one layer, C-7) with the 1.6 mm laminate between them"
    source: design
