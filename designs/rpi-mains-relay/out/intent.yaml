    walls: "NS14126 inside ~353 x 302 x 152 mm; board 200 x 150 on JP1412P"
    arrangement: "board in the lower (south) half of the back panel, centred, north edge (J1-J4) toward the top wall; compartment north of MP1 ~140 mm tall holds the field wiring, the EGC splice and the receptacle block, which hangs from the cover's upper half (3-gang cut-out centred ~75 mm below the top wall; receptacle backs reach ~40 mm into the 152 mm depth); branch cable in through the top wall"
