domains:
  - name: LV
    kind: elv
    ref: GND
    earthed: true
    description: "Roof strings, VINT bus, AUX, logic, IG/CAN wires, pack-case NTCs. <= 38 V (PV inputs clamped at 54 V by TVS); ISO 7637 pulses on IGN_IN. Chassis-referenced."
  - name: CHASSIS
    kind: elv
    ref: GND
    earthed: true
    description: "Vehicle chassis: the die-cast boxes, mounting screws, the LV-side thermal pedestal and plated holes H701-H704. Bonded to GND by NT701. Touchable."
  - name: HV
    kind: hv
    ref: HV_N
    earthed: false
    description: "T301 secondary, rectifier, HV sense high sides, IMD bridge HV ends, HV cable, D901/K901/K902. 0-420 V internal. Floating: under one insulation fault any HV net can be 0..420 V to chassis."
  - name: PACK
    kind: battery
    ref: HV_N
    earthed: false
    description: "Prius Prime Li-ion pack, 95s, 285-399 V, tapped on the cell side of the system main relays. Floats on HV_N: K902/F902 join BAT_TAP_N to HV_N, so the connected case is modelled (README) with a functional barrier across the open contacts. Under one insulation fault a pole can be 399 V from chassis."
  - name: KSUP
    kind: elv
    ref: AUX12
    earthed: false
    description: "HVIL loop: AUX12 through the lid switches S701/S901; equal to AUX12 when both lids are closed, pulled toward 0 V (flyback D902/D903) when one opens"
  - name: K1C
    kind: elv
    ref: K_SUP
    earthed: false
    description: "K1_COIL_N: low side of an inductive load on AUX12 (relays via the HVIL K_SUP); clamped to AUX12 + 0.7 V by the TPL7407 COM diodes and to K_SUP + 0.7 V by D902/D903"
  - name: K2C
    kind: elv
    ref: K_SUP
