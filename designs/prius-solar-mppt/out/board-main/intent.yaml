barriers:
  - a: LV
    b: HV
    grade: reinforced
    v_work: 420.0
    creepage_mm: 10.0
    clearance_mm: 8.0
    standard: "IEC 60664-1 Tables F.1, F.2, F.4"
    v_test_rms: 4250
    pollution_degree: 2
    material_group: IIIa
    ovc: II
    slot: true
    source: "IEC 60664-1 via TI SLUP419 Tables (docs/topics/rules/isolation-creepage.md): F.4 PD2 material group III 400 V row = 4.0 mm basic [P]; 500 V row = 5.0 mm basic [S]; working voltage 420 V -> 500 V row -> 10.0 mm reinforced. F.1 <= 600 V OVC II = 4 kV basic, reinforced one step up = 6 kV -> F.2 5.5 mm; design 8.0 mm (matches the G9KB coil-contact clearance). AC test = 6 kV peak / sqrt 2 = 4.24 kVrms"
    notes: "routed slot >= 2 mm wide under T301, U401, U421, U441; no copper on any layer in the band; isolator packages are material group I (5.0 mm needed, 8 mm provided) with the slot giving the PCB path"
  - a: LV
    b: PACK
    grade: reinforced
    v_work: 399.0
    creepage_mm: 10.0
